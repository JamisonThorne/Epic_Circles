[project]
name = "epic_circles"
version = "0.1.0"
description = "A short description of what this project does"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipykernel>=6.29",   # so notebooks can use this environment
    # "jupytext",    # pairs .ipynb with diff-friendly .py files
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N"]  # pyflakes, pycodestyle, isort, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["src"]
