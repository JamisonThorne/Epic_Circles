[project]
name = "project_template"
version = "0.1.0"
description = "A short description of what this project does"
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "numpy"
    # "pandas>=2.0",
    # "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "ipykernel>=6.29",   # so notebooks can use this environment
    "jupytext>=1.16",    # pairs .ipynb with diff-friendly .py files
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/myproject"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]  # pyflakes, pycodestyle, isort, pyupgrade

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=myproject --cov-report=term-missing"
